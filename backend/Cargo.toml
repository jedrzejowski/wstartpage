[package]
name = "wstartpage"
version = "0.0.1"
authors = ["Adam Jędrzejowski <adam@jedrzejowski.pl>"]
edition = "2021"

[[bin]]
name = "serve"
path = "src/main_serve.rs"

[[bin]]
name = "static-user-manage"
path = "src/main_static_file_manage.rs"

[dependencies]
axum = { version = "0.8.1", features = ["default", "macros"] }
axum-extra = { version = "0.10.0", features = ["typed-header"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.115"
serde_yml = "0.0.12"
anyhow = "1.0.97"
futures = "0.3.30"
log = "0.4.26"
env_logger = "0.11.7"
mime = "0.3.17"
envy = "0.4.2"
dotenv = "0.15.0"
async-trait = { version = "0.1.88", features = [] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
csv = { version = "1.3.1", features = [] }
http = "1.3.1"
normalize-path = "0.2.1"
sha2 = "0.10.8"
hex = "0.4.3"
